# 大麦抢票配置文件（每换一场演出改这里）

# 演出详情页链接（浏览器打开大麦详情页后直接复制地址栏）
# 当前为 dry-run 试验场次：2026花粥「顺水推粥」巡回音乐会·北京站（直购型）
show_url: "https://detail.damai.cn/item.htm?id=1082874823526"

# 场次关键字（模糊匹配详情页上的场次文字，如日期或城市）
session: "11-13"

# 票档关键字（模糊匹配票档文字，取当前有票的最低档）
ticket: "188元"

# 购票数量（试验用 1 张）
quantity: 1

# 开售时间（北京时间，格式 YYYY-MM-DD HH:MM:SS）；dry-run 模式忽略此项
sale_time: "2026-10-12 10:00:00"

# 刷新基础间隔（毫秒），为控制风控风险不建议低于 500
refresh_interval_ms: 500

# 刷新间隔随机抖动上限（毫秒），实际间隔 = 基础间隔 + random(0, 抖动)
refresh_jitter_ms: 200

# 开售后最长重试时间（分钟），超时仍未抢到则放弃并提醒
max_retry_minutes: 10
